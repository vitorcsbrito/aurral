name: Validate

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: aurral
          POSTGRES_PASSWORD: aurral
          POSTGRES_DB: aurral_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U aurral -d aurral_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://aurral:aurral@localhost:5433/aurral_test
      # Suite waits on I/O, so oversubscribing the 4 vCPUs pays off.
      AURRAL_TEST_CONCURRENCY: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      - name: Ensure validation runtime dependencies
        run: |
          if command -v fc-match >/dev/null 2>&1 && command -v ffmpeg >/dev/null 2>&1 && [ "$(fc-match -f '%{family}' 'Noto Color Emoji')" = "Noto Color Emoji" ]; then
            exit 0
          fi

          apt_prefix=()
          if [ "$(id -u)" -ne 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              apt_prefix=(sudo)
            else
              echo "ffmpeg and fontconfig are required for validation."
              echo "Install ffmpeg, fontconfig, fonts-dejavu-core, and fonts-noto-color-emoji on the runner."
              exit 1
            fi
          fi

          chrome_sources=()
          restore_chrome_sources() {
            for source in "${chrome_sources[@]}"; do
              "${apt_prefix[@]}" mv "$source.disabled" "$source"
            done
          }
          trap restore_chrome_sources EXIT

          while IFS= read -r source; do
            "${apt_prefix[@]}" mv "$source" "$source.disabled"
            chrome_sources+=("$source")
          done < <(grep -ril 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)

          "${apt_prefix[@]}" apt-get update
          "${apt_prefix[@]}" apt-get install -y ffmpeg fontconfig fonts-dejavu-core fonts-noto-color-emoji

      - run: npm ci

      - name: Set up bundled beets matcher runtime
        run: |
          matcher_venv="${RUNNER_TEMP:-/tmp}/aurral-beets-venv"
          python3 -m venv "$matcher_venv"
          "$matcher_venv/bin/pip" install --no-compile -r backend/matcher/requirements.txt
          echo "AURRAL_MATCHER_PYTHON=$matcher_venv/bin/python" >> "$GITHUB_ENV"

      - run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Build app
        run: npm run build

      - name: Build docs
        run: |
          npm ci
          npm run build
        working-directory: docs

      - name: Start app
        run: |
          touch backend/.env
          npm start > /tmp/aurral.log 2>&1 &
          echo $! > /tmp/aurral.pid

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /tmp/aurral-health.json; then
              cat /tmp/aurral-health.json
              exit 0
            fi
            sleep 2
          done
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi
          exit 1

      - name: Print app log on failure
        if: failure()
        run: |
          if [ -f /tmp/aurral.log ]; then
            cat /tmp/aurral.log
          else
            echo "App log not found at /tmp/aurral.log"
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/aurral.pid ]; then
            kill "$(cat /tmp/aurral.pid)" || true
          fi

      # The production image is built and smoke-tested once, in Preview.
      - name: Check Dockerfile
        run: docker build --check .
